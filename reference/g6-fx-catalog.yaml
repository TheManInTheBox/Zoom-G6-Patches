        params:
          - { name: FREQ,  description: "This sets the emphasized frequency. (Pedal-controllable.)", raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: RESO,  description: Sets effect resonance., raw: "-10 – 10", typed: { kind: int, min: -10, max: 10 } }
          - { name: HiDMP, description: Adjusts the treble attenuation of the effect sound., raw: "0 – 10", typed: { kind: int, min: 0, max: 10 } }
          - { name: Mix,   description: Adjusts the amount of effected sound that is mixed with the original sound., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

      - name: PDL Reso
        page: 29
        description: Pedal wah with a strong character.
        params:
          - { name: FREQ, description: "Adjusts the emphasized frequency. (Pedal-controllable.)", raw: "1 – 50", typed: { kind: int, min: 1, max: 50 } }
          - { name: RESO, description: Sets effect resonance., raw: "0 – 10", typed: { kind: int, min: 0, max: 10 } }
          - { name: Dry,  description: Adjusts the volume of the unaffected sound., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: VOL,  description: Adjusts the volume., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

      - name: Output VP
        page: 29
        description: This controls the product output level. This volume will be kept even when the patch memory is changed.
        params: []
        notes:
          - "Source PDF shows '- -' for parameter list; this effect exposes no patch-level parameters. The actual output volume is controlled by the expression pedal in real time."

  SND-RTN:
    pages: [30]
    effects:
      - name: FxLoop
        page: 30
        description: Use this to insert an external effect, for example, between effects on this unit. The signal will be sent to the SEND jack from the position where this effect is placed, and the signal from the RETURN jack will be returned to the same position.
        params:
          - { name: Send,   description: Adjusts the SEND jack output level., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Return, description: Adjusts the RETURN jack input level., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Dry,    description: Adjusts the volume of the unaffected sound., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Vol,    description: Adjusts the volume., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

      - name: Send
        page: 30
        description: Use this to output sound to an external effect, for example, in the middle of the effect chain of this unit. The signal will be sent to the SEND jack from the position where this effect is placed.
        params:
          - { name: Send,   description: Adjusts the SEND jack output level., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Dry,    description: Adjusts the volume of the unaffected sound., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Mode,   description: "Chooses the function assigned to SEND. When it is set to SUBOUT, the patch level and master volume are applied to the output signal to SEND.", raw: "SEND, SUBOUT", typed: { kind: enum, values: [SEND, SUBOUT] } }
          - { name: ON/OFF, description: Sets the foot switch function., raw: "LATCH, UnLATCH", typed: { kind: enum, values: [LATCH, UnLATCH] } }

      - name: Return
        page: 30
        description: Use this to mix the sound from an external effect, for example, into the middle of the effect chain of this unit. The signal from the RETURN jack will be returned to the position where this effect is placed.
        params:
          - { name: Return, description: Adjusts the RETURN jack input level., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Phase,  description: Set the phase of the RETURN jack input signal., raw: "NORM, INV", typed: { kind: enum, values: [NORM, INV] } }
          - { name: Dry,    description: Adjusts the volume of the unaffected sound., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Vol,    description: Adjusts the volume., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

  IR:
    pages: [30]
    effects:
      - name: IR
        page: 30
        description: Impulse responses capture the acoustic characteristics of spaces and quantify them as data.
        params:
          - { name: LO,  description: Adjusts volume of low frequencies., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: HI,  description: Adjusts volume of high frequencies., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: BAL, description: "Adjusts the balance between original and effect sounds. When it is set between -100 to -1, the polarity of effect sound is reversed.", raw: "-100 – 100", typed: { kind: int, min: -100, max: 100, note: "Negative values invert effect polarity." } }
