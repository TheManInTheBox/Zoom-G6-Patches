          - { name: Mix,   description: Adjusts the amount of effected sound that is mixed with the original sound., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Tail,  description: Tail on/off behaviour., raw: "OFF, ON", typed: { kind: enum, values: [OFF, ON] } }

      - name: EarlyRef
        page: 26
        description: This effect reproduces only the early reflections of reverb.
        params:
          - { name: Decay, description: Adjusts the duration of the reverb., raw: "1 – 30", typed: { kind: int, min: 1, max: 30 } }
          - { name: Shape, description: Adjusts the effect envelope., raw: "-10 – 10", typed: { kind: int, min: -10, max: 10 } }
          - { name: Tone,  description: Adjusts the tone., raw: "0 – 10", typed: { kind: int, min: 0, max: 10 } }
          - { name: Mix,   description: Adjusts the amount of effected sound that is mixed with the original sound., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

      - name: SpaceHole
        page: 26
        description: This effect combines delay and reverb.
        params:
          - { name: PreD,  description: Adjusts the delay between input of the original sound and start of the reverb sound., raw: "0 – 1000", typed: { kind: int, min: 0, max: 1000, unit: ms } }
          - { name: Decay, description: Sets the duration of the reverberations., raw: "-100 – 100", typed: { kind: int, min: -100, max: 100 } }
          - { name: F.B,   description: Adjusts the feedback amount., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Mix,   description: Adjusts the amount of effected sound that is mixed with the original sound., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Depth, description: Sets the depth of the modulation., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Speed, description: Sets the speed of the modulation., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Size,  description: Adjusts the size of the reverb space., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

      - name: Church
        page: 26
        description: This effect simulates the reverberations of a church.
        params:
          - { name: PreD,  description: Adjusts the delay between input of the original sound and start of the reverb sound., raw: "0 – 200", typed: { kind: int, min: 0, max: 200, unit: ms } }
          - { name: Decay, description: Sets the duration of the reverberations., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Mix,   description: Adjusts the amount of effected sound that is mixed with the original sound., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Tail,  description: "When ON, effect sound continues even after effect is turned off; dry sound retains the effect-on tone.", raw: "OFF, ON", typed: { kind: enum, values: [OFF, ON] } }

      - name: Ambience
        page: 26
        description: This effect adds a natural ambience (air) to the sound.
        params:
          - { name: PreD,  description: Adjusts the delay between input of the original sound and start of the reverb sound., raw: "0 – 200", typed: { kind: int, min: 0, max: 200, unit: ms } }
          - { name: Decay, description: Sets the duration of the reverberations., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Mix,   description: Adjusts the amount of effected sound that is mixed with the original sound., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Tail,  description: "When ON, effect sound continues even after effect is turned off; dry sound retains the effect-on tone.", raw: "OFF, ON", typed: { kind: enum, values: [OFF, ON] } }

      - name: ParticleR
        page: 26
        description: This is a unique complex reverb.
        params:
          - { name: Mode,  description: Sets how the reverb sound changes., raw: "STBL, CRTCL, HZD", typed: { kind: enum, values: [STBL, CRTCL, HZD] } }
          - { name: Decay, description: Sets the duration of the reverberations., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Mix,   description: Adjusts the amount of effected sound that is mixed with the original sound., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Tail,  description: Tail on/off behaviour., raw: "OFF, ON", typed: { kind: enum, values: [OFF, ON] } }

      - name: Chamber
        page: 26
        description: This effect simulates the reverberations of a chamber-sized room.
        params:
          - { name: PreD,  description: Adjusts the delay between input of the original sound and start of the reverb sound., raw: "0 – 200", typed: { kind: int, min: 0, max: 200, unit: ms } }
          - { name: Decay, description: Sets the duration of the reverberations., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Mix,   description: Adjusts the amount of effected sound that is mixed with the original sound., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Tail,  description: Tail on/off behaviour., raw: "OFF, ON", typed: { kind: enum, values: [OFF, ON] } }

      - name: GateRev
        page: 27
        description: This unique reverb is good for percussive playing.
        params:
          - { name: Color, description: Sets the sound color., raw: "1 – 5", typed: { kind: int, min: 1, max: 5 } }
          - { name: Decay, description: Sets the duration of the reverberations., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Tone,  description: Adjusts the tone., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: BAL,   description: Adjusts the balance between original and effect sounds., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

      - name: HoldVerb
        page: 27
        description: This hold reverb effect is controlled using the foot switch.
        params:
          - { name: PreD,  description: Adjusts the delay between input of the original sound and start of the reverb sound., raw: "1 – 200", typed: { kind: int, min: 1, max: 200, unit: ms } }
          - { name: Decay, description: Sets the duration of the reverberations., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Mix,   description: Adjusts the amount of effected sound that is mixed with the original sound., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Tail,  description: Tail on/off behaviour., raw: "OFF, ON", typed: { kind: enum, values: [OFF, ON] } }
          - { name: Color, description: Adjusts the reverb time of the low frequencies., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: LoDMP, description: Adjusts low frequency damping in reverb sound., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: HiDMP, description: Adjust high frequency damping in reverb sound., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

  PEDAL:
    pages: [27, 28, 29]
    # Pedal-controllable parameter is marked "P" in source. Modelled by note on the relevant param.
    effects:
      - name: PDL Vol
        page: 27
        description: The volume curve of the volume pedal can be set.
        params:
          - { name: VOL,   description: "Adjusts the volume. (Pedal-controllable.)", raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Min,   description: Adjusts the volume when the pedal is at minimum position., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Max,   description: Adjusts the volume when the pedal is at maximum position., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Curve, description: Sets the volume curve., raw: "A, B", typed: { kind: enum, values: [A, B] } }

      - name: BlackWah
        page: 27
        description: This pedal wah effect simulates the Cry Baby.
        params:
          - { name: FREQ,  description: "Adjusts the emphasized frequency. (Pedal-controllable.)", raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Range, description: Adjusts the frequency range processed by the effect., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Dry,   description: Adjusts the volume of the unaffected sound., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: VOL,   description: Adjusts the volume., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

      - name: ChromeWah
        page: 27
        description: This simulates a British wah pedal with a chrome finish.
        params:
          - { name: FREQ,  description: "Adjusts the emphasized frequency. (Pedal-controllable.)", raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Range, description: Adjusts the frequency range processed by the effect., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Dry,   description: Adjusts the volume of the unaffected sound., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: VOL,   description: Adjusts the volume., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

      - name: WAH100
        page: 27
        description: Simulates an Ibanez wah pedal.
        params:
          - { name: FREQ,  description: "Adjusts the emphasized frequency. (Pedal-controllable.)", raw: "0 – 50", typed: { kind: int, min: 0, max: 50 } }
          - { name: Depth, description: Sets the depth of the wah., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Dry,   description: Adjusts the volume of the unaffected sound., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: VOL,   description: Adjusts the volume., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

      - name: PDL Pitch
        page: 27
        description: Use an expression pedal to change the pitch in real time with this effect.
        params:
          - { name: Bend, description: "Sets the amount of pitch shift. (Pedal-controllable.)", raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - name: Color
            description: Sets the type of pitch change control with the expression pedal.
            raw: "+1 OCT – DWN/OCT (See Table 2)"
            typed: { kind: special, note: "Enumerated list of pitch-bend curves spanning +1 OCT down to DWN/OCT. Exact value names listed in Table 2 of the source PDF — consult before assigning." }
          - { name: Tone, description: Adjusts the tone., raw: "0 – 10", typed: { kind: int, min: 0, max: 10 } }
          - { name: Mode, description: Sets the sound style., raw: "UP, DOWN", typed: { kind: enum, values: [UP, DOWN] } }
        notes:
          - "Color values reference Table 2 in the source PDF."

      - name: PDL MnPit
        page: 28
        description: This is a pitch shifter specially for monophonic sound (single-note playing), which allows the pitch to be shifted in real time with the expression pedal.
        params:
          - { name: Bend, description: "Sets the amount of pitch shift. (Pedal-controllable.)", raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - name: Color
            description: Sets the type of pitch change control with the expression pedal.
            raw: "+1 OCT – DWN/OCT (See Table 2)"
            typed: { kind: special, note: "Enumerated list of pitch-bend curves spanning +1 OCT down to DWN/OCT. See Table 2." }
          - { name: Tone, description: Adjusts the tone., raw: "0 – 10", typed: { kind: int, min: 0, max: 10 } }
          - { name: Mode, description: Sets the sound style., raw: "UP, DOWN", typed: { kind: enum, values: [UP, DOWN] } }
        notes:
          - "Color values reference Table 2 in the source PDF."

      - name: PDL Vibe
        page: 28
        description: This vibe sound features unique undulations.
        params:
          - { name: Speed, description: "Sets the speed of the modulation. (Pedal-controllable.)", raw: "0 – 50", typed: { kind: int, min: 0, max: 50 } }
          - { name: Depth, description: Sets the depth of the modulation., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Mode,  description: Sets effect to vibrato or chorus., raw: "VIBRAT, CHORS", typed: { kind: enum, values: [VIBRAT, CHORS] } }
          - { name: VOL,   description: Adjusts the volume., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

      - name: PDL Drive
        page: 28
        description: The expression pedal controls the gain of this drive effect.
        params:
          - { name: Gain,  description: "Adjusts the gain. (Pedal-controllable.)", raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Tone,  description: Adjusts the tone., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: PRSNC, description: Adjusts volume of super-high frequencies., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: VOL,   description: Adjusts the volume., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

      - name: PDL PHSR
        page: 28
        description: The expression pedal controls the modulation frequency of this phaser.
        params:
          - { name: Rate,  description: "Sets the speed of the modulation. (Pedal-controllable.)", raw: "1 – 50", typed: { kind: int, min: 1, max: 50 } }
          - { name: Depth, description: Sets the depth of the modulation., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: RESO,  description: Sets effect resonance., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Color, description: Sets the tone of the effect type., raw: "4 STG, 8 STG, INV 4, INV 8", typed: { kind: enum, values: ["4 STG", "8 STG", "INV 4", "INV 8"] } }

      - name: PDL Delay
        page: 28
        description: The expression pedal controls the delay input level of this effect.
        params:
          - { name: InLvl, description: "Adjusts the delay input level. (Pedal-controllable.)", raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Time,  description: Sets the delay time., raw: "1 – 4000", typed: { kind: int, min: 1, max: 4000, unit: ms } }
          - { name: F.B,   description: Adjusts the feedback amount., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Mix,   description: Adjusts the amount of effected sound that is mixed with the original sound., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

      - name: PDL Rev
        page: 28
        description: The expression pedal controls the reverb input level of this effect.
        params:
          - { name: InLvl, description: "Adjusts the reverb input level. (Pedal-controllable.)", raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: PreD,  description: Adjusts the delay between input of the original sound and start of the reverb sound., raw: "1 – 100", typed: { kind: int, min: 1, max: 100, unit: ms } }
          - { name: Decay, description: Sets the duration of the reverberations., raw: "1 – 30", typed: { kind: int, min: 1, max: 30 } }
          - { name: Mix,   description: Adjusts the amount of effected sound that is mixed with the original sound., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

      - name: OSC Echo
        page: 28
        description: The expression pedal controls the delay oscillation of this effect.
        params:
          - { name: OSC,   description: "Adjusts the delay time and feedback. (Pedal-controllable.)", raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: T-Min, description: Adjusts the delay time when the pedal is at minimum position., raw: "19 – 500", typed: { kind: int, min: 19, max: 500, unit: ms } }
          - { name: T-Max, description: Adjusts the delay time when the pedal is at maximum position., raw: "19 – 500", typed: { kind: int, min: 19, max: 500, unit: ms } }
          - { name: Mix,   description: Adjusts the amount of effected sound that is mixed with the original sound., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

      - name: VoiceWah
        page: 28
        description: This effect can make a guitar sound like a human voice.
