categories:

  DYNAMICS:
    pages: [3, 4]
    effects:
      - name: Comp
        page: 3
        description: This compressor in the style of the MXR Dyna Comp.
        params:
          - { name: Sense, description: Adjusts the sensitivity of the effect., raw: "0 – 10",  typed: { kind: int, min: 0, max: 10 } }
          - { name: ATTCK, description: Sets compressor attack speed to Fast or Slow., raw: "SLOW, FAST", typed: { kind: enum, values: [SLOW, FAST] } }
          - { name: Tone,  description: Adjusts the tone., raw: "0 – 10",  typed: { kind: int, min: 0, max: 10 } }
          - { name: VOL,   description: Adjusts the volume., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

      - name: RackComp
        page: 3
        description: This compressor allows more detailed adjustment than Comp.
        params:
          - { name: THRSH, description: Sets the level that activates the compressor., raw: "0 – 50",  typed: { kind: int, min: 0, max: 50 } }
          - { name: Ratio, description: Adjusts the compression ratio., raw: "1 – 10",  typed: { kind: int, min: 1, max: 10 } }
          - { name: ATTCK, description: Sets compressor attack speed., raw: "1 – 10",  typed: { kind: int, min: 1, max: 10 } }
          - { name: VOL,   description: Adjusts the volume., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

      - name: SlowATTCK
        page: 3
        description: This effect slows the attack of each note, resulting in a violin-like performance.
        params:
          - { name: Time,  description: Adjusts the attack time., raw: "1 – 50",  typed: { kind: int, min: 1, max: 50 } }
          - { name: Curve, description: Set the curve of volume change during attack., raw: "0 – 10",  typed: { kind: int, min: 0, max: 10 } }
          - { name: Tone,  description: Adjusts the tone., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: VOL,   description: Adjusts the volume., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

      - name: ZNR
        page: 3
        description: ZOOM's unique noise reduction cuts noise during pauses in playing without affecting the tone.
        params:
          - { name: DETCT, description: Sets control signal detection level., raw: "GTRIN, EFXIN", typed: { kind: enum, values: [GTRIN, EFXIN] } }
          - { name: Depth, description: Sets the depth of noise reduction., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: THRSH, description: Adjusts the effect sensitivity., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Decay, description: Adjust the envelope release., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

      - name: MuteSW
        page: 3
        description: This effect allows you to mute the volume using the foot switch.
        params:
          - { name: Edge,   description: "Sets how smoothly the volume changes. As the parameter value increases, the change becomes smoother.", raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Speed,  description: Adjust the recovery time from muting., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: INVRT,  description: Sets the foot switch control direction., raw: "NORMAL, INVERT", typed: { kind: enum, values: [NORMAL, INVERT] } }
          - { name: ON/OFF, description: Sets the foot switch function., raw: "LATCH, UnLATCH, TRGGR", typed: { kind: enum, values: [LATCH, UnLATCH, TRGGR] } }

      - name: GrayComp
        page: 3
        description: This models a ROSS Compressor. Added parameters allow you to adjust the tone.
        params:
          - { name: SUSTN, description: Adjusts the sustain., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Lo,    description: Adjusts volume of low frequencies., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Hi,    description: Adjusts volume of high frequencies., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: VOL,   description: Adjusts the volume., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

      - name: NoiseGate
        page: 3
        description: This is a noise gate that cuts the sound during playing pauses.
        params:
          - { name: DETCT, description: Sets control signal detection level., raw: "GTRIN, EFXIN", typed: { kind: enum, values: [GTRIN, EFXIN] } }
          - { name: Depth, description: Sets the depth of noise reduction., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: THRSH, description: Adjusts the effect sensitivity., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Decay, description: Adjust the envelope release., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

      - name: OptComp
        page: 3
        description: This is an optical compressor.
        params:
          - { name: Drive, description: Adjusts the depth of the compression., raw: "0 – 10",  typed: { kind: int, min: 0, max: 10 } }
          - { name: Lo,    description: Adjusts volume of low frequencies., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Hi,    description: Adjusts volume of high frequencies., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: VOL,   description: Adjusts the volume., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

      - name: BlackOpt
        page: 4
        description: This is a simulation of the Demeter COMP-1 Compulator. Added parameters allow you to adjust the tone.
        params:
          - { name: Comp, description: Adjusts the depth of the compression., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Lo,   description: Adjusts volume of low frequencies., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Hi,   description: Adjusts volume of high frequencies., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: VOL,  description: Adjusts the volume., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

      - name: LMT-76
        page: 4
        description: This is a simulation of the UREI 1176LN.
        params:
          - { name: Input,  description: Adjusts the input level., raw: "0 – 80", typed: { kind: int, min: 0, max: 80 } }
          - { name: Ratio,  description: Adjusts the compression ratio., raw: "4:1, 8:1, 12:1, 20:1", typed: { kind: enum, values: ["4:1", "8:1", "12:1", "20:1"] } }
          - { name: REL,    description: This is a limiter that suppresses signal peaks above a certain reference level., raw: "10 – 70", typed: { kind: int, min: 10, max: 70 } }
          - { name: Output, description: Adjusts the output level., raw: "0 – 80", typed: { kind: int, min: 0, max: 80 } }

