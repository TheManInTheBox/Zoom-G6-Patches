  MODULATION:
    pages: [18, 19, 20, 21]
    effects:
      - name: Tremolo
        page: 18
        description: This effect varies the volume at a regular rate.
        params:
          - { name: Wave,  description: Sets the modulation waveform., raw: "TRI, TUBE, SQR", typed: { kind: enum, values: [TRI, TUBE, SQR] } }
          - { name: Depth, description: Sets the depth of the modulation., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Rate,  description: Sets the speed of the modulation., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: VOL,   description: Adjusts the volume., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

      - name: Chorus
        page: 18
        description: This effect mixes a shifted pitch with the original sound to add movement and thickness.
        params:
          - { name: Depth, description: Sets the depth of the modulation., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Rate,  description: Sets the speed of the modulation., raw: "1 – 50",  typed: { kind: int, min: 1, max: 50 } }
          - { name: Tone,  description: Adjusts the tone., raw: "0 – 10", typed: { kind: int, min: 0, max: 10 } }
          - { name: Mix,   description: Adjusts the amount of effected sound that is mixed with the original sound., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

      - name: StereoCho
        page: 18
        description: This is a stereo chorus with a clear tone.
        params:
          - { name: Depth, description: Sets the depth of the modulation., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Rate,  description: Sets the speed of the modulation., raw: "1 – 50",  typed: { kind: int, min: 1, max: 50 } }
          - { name: Tone,  description: Adjusts the tone., raw: "0 – 10", typed: { kind: int, min: 0, max: 10 } }
          - { name: Mix,   description: Adjusts the amount of effected sound that is mixed with the original sound., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

      - name: Phaser
        page: 18
        description: This effect adds a phasing variation to the sound.
        params:
          - { name: Color, description: Sets the tone of the effect type., raw: "4 STG, 8 STG, INV 4, INV 8", typed: { kind: enum, values: ["4 STG", "8 STG", "INV 4", "INV 8"] } }
          - { name: Depth, description: Sets the depth of the modulation., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Rate,  description: Sets the speed of the modulation., raw: "1 – 50",  typed: { kind: int, min: 1, max: 50 } }
          - { name: RESO,  description: Sets effect resonance., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

      - name: VinFLNGR
        page: 18
        description: This analog flanger sound is similar to an MXR M-117R.
        params:
          - { name: PreD,  description: Sets pre-delay time of effect sound., raw: "0 – 50",  typed: { kind: int, min: 0, max: 50 } }
          - { name: Depth, description: Sets the depth of the modulation., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Rate,  description: Sets the speed of the modulation., raw: "0 – 50",  typed: { kind: int, min: 0, max: 50 } }
          - { name: RESO,  description: Sets effect resonance., raw: "-10 – 10", typed: { kind: int, min: -10, max: 10 } }

      - name: TheVibe
        page: 18
        description: This vibe sound features unique undulations.
        params:
          - { name: Speed, description: Sets the speed of the modulation., raw: "0 – 50",  typed: { kind: int, min: 0, max: 50 } }
          - { name: Depth, description: Sets the depth of the modulation., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Mode,  description: Sets effect to vibrato or chorus., raw: "VIBRT, CHORS", typed: { kind: enum, values: [VIBRT, CHORS] } }
          - { name: VOL,   description: Adjusts the volume., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

      - name: Vibrato
        page: 18
        description: This effect automatically adds vibrato.
        params:
          - { name: Depth, description: Sets the depth of the modulation., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Rate,  description: Sets the speed of the modulation., raw: "0 – 50",  typed: { kind: int, min: 0, max: 50 } }
          - { name: Tone,  description: Adjusts the tone., raw: "0 – 10", typed: { kind: int, min: 0, max: 10 } }
          - { name: BAL,   description: Adjusts the balance between original and effect sounds., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

      - name: SwellVibe
        page: 18
        description: This effect modulates the pitch after picking.
        params:
          - { name: Depth, description: Sets the depth of the modulation., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Speed, description: Sets the speed of the modulation., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Rise,  description: Sets the time before the effect begins to modulate the pitch., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Vol,   description: Adjusts the output level., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

      - name: Octave
        page: 19
        description: This effect adds sound one octave and two octaves below the original sound.
        params:
          - { name: OCT1, description: Adjusts the level of the sound one octave below the effect sound., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: OCT2, description: Adjusts the level of the sound two octaves below the effect sound., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Tone, description: Adjusts the tone., raw: "0 – 10", typed: { kind: int, min: 0, max: 10 } }
          - { name: Dry,  description: Adjusts the volume of the unaffected sound., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

      - name: RingMod
        page: 19
        description: This effect produces a metallic ringing sound. Adjusting the "FREQ" parameter results in a drastic change of sound character.
        params:
          - { name: FREQ, description: Sets the frequency of the modulation., raw: "1 – 50", typed: { kind: int, min: 1, max: 50 } }
          - { name: Tone, description: Adjusts the tone., raw: "0 – 10", typed: { kind: int, min: 0, max: 10 } }
          - { name: BAL,  description: Adjusts the balance between original and effect sounds., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: VOL,  description: Adjusts the volume., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

      - name: Detune
        page: 19
        description: By mixing an effect sound that is slightly pitch-shifted with the original sound, this effect type has a chorus effect without much sense of modulation.
        params:
          - { name: Cent, description: Adjusts the detuning in cents, which are fine increments of 1/100-semitone., raw: "-25 – 25", typed: { kind: int, min: -25, max: 25, unit: cents } }
          - { name: PreD, description: Sets the pre-delay time of the effect sound., raw: "0 – 50",  typed: { kind: int, min: 0, max: 50 } }
          - { name: Tone, description: Adjusts the tone., raw: "0 – 10", typed: { kind: int, min: 0, max: 10 } }
          - { name: Mix,  description: Adjusts the amount of effected sound that is mixed with the original sound., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

      - name: PitchSHFT
        page: 19
        description: This effect shifts the pitch up or down.
        params:
          - name: Shift
            description: "Adjusts the pitch shift amount in semitones. Selecting '0' gives a detuning effect."
            raw: "-12–12, 24"
            typed: { kind: special, note: "Integer semitones from -12 to 12, plus the discrete value 24 (an octave up of +12)." }
          - { name: Fine, description: Allows fine adjustment of pitch shift amount in Cent (1/100 semitone) steps., raw: "-25 – 25", typed: { kind: int, min: -25, max: 25, unit: cents } }
          - { name: Tone, description: Adjusts the tone., raw: "0 – 10", typed: { kind: int, min: 0, max: 10 } }
          - { name: BAL,  description: Adjusts the balance between original and effect sounds., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

      - name: PolyShift
        page: 19
        description: This pitch shifter supports chord playing.
        params:
          - { name: Shift, description: Adjusts the pitch shift amount in semitones., raw: "-24 – 24", typed: { kind: int, min: -24, max: 24, unit: semitones } }
          - { name: Tone,  description: Adjusts the tone., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Wet,   description: Adjust the amount of the effect sound in the mix., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Dry,   description: Adjust the amount of the original sound in the mix., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

      - name: MonoPitch
        page: 19
        description: This is a pitch shifter with little sound variance for monophonic (single note) playing.
        params:
          - name: Shift
            description: "Adjusts the pitch shift amount in semitones. Selecting '0' gives a detuning effect."
            raw: "-12–12, 24"
            typed: { kind: special, note: "Integer semitones from -12 to 12, plus the discrete value 24." }
          - { name: Fine, description: Allows fine adjustment of pitch shift amount in Cent (1/100 semitone) steps., raw: "-25 – 25", typed: { kind: int, min: -25, max: 25, unit: cents } }
          - { name: Tone, description: Adjusts the tone., raw: "0 – 10", typed: { kind: int, min: 0, max: 10 } }
          - { name: BAL,  description: Adjusts the balance between original and effect sounds., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

      - name: HPS
        page: 19
        description: This intelligent pitch shifter outputs the effect sound with the pitch shifted according to scale and key settings.
        params:
          - name: Scale
            description: Sets the pitch of the pitch-shifted sound added to the original sound.
            raw: "-6, -5, -4, -3, -m, m, 3, 4, 5, 6 (See Table 1)"
            typed: { kind: enum, values: ["-6", "-5", "-4", "-3", "-m", "m", "3", "4", "5", "6"] }
          - { name: Key,  description: Sets the tonic (root) of the scale used for pitch shifting., raw: "C, C#, D, D#, E, F, F#, G, G#, A, A#, B", typed: { kind: enum, values: [C, "C#", D, "D#", E, F, "F#", G, "G#", A, "A#", B] } }
          - { name: Tone, description: Adjusts the tone., raw: "0 – 10", typed: { kind: int, min: 0, max: 10 } }
          - { name: Mix,  description: Adjusts the amount of effected sound that is mixed with the original sound., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
        notes:
          - "Scale values reference Table 1 in the source PDF. Letter codes: 'm' = minor 6th/3rd interval pair; '-' prefix = lower direction. Verify intended interval against the PDF table before use."

      - name: Kick FLNG
        page: 20
        description: This flanger is controlled using the foot switch.
        params:
          - { name: PreD,   description: Sets pre-delay time of effect sound., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Depth,  description: Sets the depth of the modulation., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Rate,   description: Sets the speed of the modulation., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: ON/OFF, description: Sets the foot switch function., raw: "LATCH, UnLATCH", typed: { kind: enum, values: [LATCH, UnLATCH] } }
          - { name: RESO,   description: Sets effect resonance., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Mix,    description: Adjusts the amount of effected sound that is mixed with the original sound., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: RST-F,  description: Adjusts the LFO reset frequency., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

      - name: Slicer
        page: 20
        description: This effect creates a rhythmical sound by continuously slicing the input.
        params:
          - { name: PTTRN, description: Sets effect pattern., raw: "1 – 20", typed: { kind: int, min: 1, max: 20 } }
          - name: Speed
            description: Sets the speed of the modulation.
            raw: "1 – 50 ♪"
            typed: { kind: special, note: "Integer 1–50 plus optional tempo-sync note-value glyph (♪) — when tempo-sync is selected, the value is a musical note division rather than a raw integer." }
          - { name: THRSH, description: Adjusts effect threshold., raw: "0 – 50",  typed: { kind: int, min: 0, max: 50 } }
          - { name: VOL,   description: Adjusts the volume., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

      - name: CloneCho
