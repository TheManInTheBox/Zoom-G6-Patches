          - { name: Speed, description: Sets the speed of the modulation., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Tone,  description: Adjusts the tone., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Mix,   description: Adjusts the amount of effected sound that is mixed with the original sound., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

