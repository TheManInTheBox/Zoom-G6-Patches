            typed: { kind: special, note: "Integer 1–50, or the discrete enum values SyncA (sync to LFO A) and RvrsA (reverse of LFO A)." }
          - { name: Reso B, description: Sets the resonance of LFO B modulation., raw: "0 – 10", typed: { kind: int, min: 0, max: 10 } }
          - { name: VOL,    description: Adjusts the volume., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

      - name: GEMINOS
        page: 21
        description: This effect allows you to obtain doubling tracking in real time.
        params:
          - { name: Tight, description: Adjusts the tightness of the doubling track king., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Mode,  description: Select Stereo / Mono and select the number of tracks., raw: "MN-3, MN-2, MN-1, ST-1, ST-2, ST-3", typed: { kind: enum, values: [MN-3, MN-2, MN-1, ST-1, ST-2, ST-3] } }
          - { name: Wet,   description: Adjust the amount of the effect sound in the mix., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Dry,   description: Adjust the amount of the original sound in the mix., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

  SFX:
    pages: [21, 22]
    effects:
      - name: Bomber
        page: 21
        description: This effect generates explosive sounds.
        params:
          - { name: Decay,  description: Adjusts the length of the explosive sound., raw: "1 – 100", typed: { kind: int, min: 1, max: 100 } }
          - { name: Tone,   description: Adjusts the tone., raw: "0 – 10", typed: { kind: int, min: 0, max: 10 } }
          - { name: Mix,    description: Adjusts the amount of effected sound that is mixed with the original sound., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: ON/OFF, description: Sets the foot switch function., raw: "LATCH, TRGGR", typed: { kind: enum, values: [LATCH, TRGGR] } }

      - name: AutoPan
        page: 21
        description: This effect moves the sound image cyclically left and right.
        params:
          - { name: Rate,  description: Sets the speed of the modulation., raw: "0 – 50", typed: { kind: int, min: 0, max: 50 } }
          - { name: Width, description: Sets the width of the panning., raw: "0 – 50", typed: { kind: int, min: 0, max: 50 } }
          - { name: Clip,  description: Adjusts the amount of waveform clipping. Higher values emphasize the auto-panning effect more., raw: "0 – 10", typed: { kind: int, min: 0, max: 10 } }
          - { name: VOL,   description: Adjusts the volume., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

      - name: LoopRoll
        page: 22
        description: This effect allows you use the footswitch to sample and hold what you play.
        params:
          - { name: Time,   description: Sets the loop time., raw: "10 – 4000", typed: { kind: int, min: 10, max: 4000, unit: ms } }
          - { name: Duty,   description: Sets the time that the sample-and-hold sound is produced., raw: "25 – 100", typed: { kind: int, min: 25, max: 100 } }
          - { name: BAL,    description: Adjusts the balance between original and effect sounds., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: ON/OFF, description: Sets the foot switch function., raw: "LATCH, UnLATCH", typed: { kind: enum, values: [LATCH, UnLATCH] } }

      - name: HotSpice
        page: 22
        description: This effect simulates a sitar tone.
        params:
          - { name: Bend,  description: Adjust the depth of the pitch bend., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Buzz,  description: Adjust the buzzing tone., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: +1oct, description: Adjust the volume of one octave up., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: VOL,   description: Adjusts the volume., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

  DELAY:
    pages: [22, 23, 24]
    # Tail parameter shared semantic: "When ON, effect sound continues even after effect is turned off.
    # When OFF, effect sound stops right when effect is turned off." (raw "OFF, ON" / enum [OFF, ON]).
    effects:
      - name: Delay
        page: 22
        description: This long delay has a maximum length of 4000 ms.
        params:
          - { name: Time, description: Sets the delay time., raw: "1 – 4000", typed: { kind: int, min: 1, max: 4000, unit: ms } }
          - { name: F.B,  description: Adjusts the feedback amount., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Mix,  description: Adjusts the amount of effected sound that is mixed with the original sound., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Tail, description: When ON, effect sound continues even after effect is turned off. When OFF, effect sound stops right when effect is turned off., raw: "OFF, ON", typed: { kind: enum, values: [OFF, ON] } }

      - name: AnalogDly
        page: 22
        description: This analog delay simulation has a long delay with a maximum length of 4000 ms.
        params:
          - { name: Time, description: Sets the delay time., raw: "1 – 4000", typed: { kind: int, min: 1, max: 4000, unit: ms } }
          - { name: F.B,  description: Adjusts the feedback amount., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Mix,  description: Adjusts the amount of effected sound that is mixed with the original sound., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Tail, description: Tail on/off behaviour as Delay., raw: "OFF, ON", typed: { kind: enum, values: [OFF, ON] } }

      - name: TapeEcho
        page: 22
        description: This effect simulates a tape echo. Changing the "Time" parameter changes the pitch of the echoes.
        params:
          - { name: Time, description: Sets the delay time., raw: "1 – 2000", typed: { kind: int, min: 1, max: 2000, unit: ms } }
          - { name: F.B,  description: Adjusts the feedback amount., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Mix,  description: Adjusts the amount of effected sound that is mixed with the original sound., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Tail, description: Tail on/off behaviour as Delay., raw: "OFF, ON", typed: { kind: enum, values: [OFF, ON] } }

      - name: ReverseDL
        page: 22
        description: This reverse delay is a long delay with a maximum length of 2000 ms.
        params:
          - { name: Time, description: Sets the delay time., raw: "10 – 2000", typed: { kind: int, min: 10, max: 2000, unit: ms } }
          - { name: F.B,  description: Adjusts the feedback amount., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: BAL,  description: Adjusts the balance between original and effect sounds., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Tail, description: Tail on/off behaviour as Delay., raw: "OFF, ON", typed: { kind: enum, values: [OFF, ON] } }

      - name: ModDelay
        page: 22
        description: This delay effect allows the use of modulation.
        params:
          - { name: Time, description: Sets the delay time., raw: "1 – 2000", typed: { kind: int, min: 1, max: 2000, unit: ms } }
          - { name: F.B,  description: Adjusts the feedback amount., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Mix,  description: Adjusts the amount of effected sound that is mixed with the original sound., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Tail, description: Tail on/off behaviour as Delay., raw: "OFF, ON", typed: { kind: enum, values: [OFF, ON] } }

      - name: Hold DLY
        page: 23
        description: This hold delay effect is controlled using the foot switch.
        params:
          - { name: Time,  description: Sets the delay time., raw: "1 – 4000", typed: { kind: int, min: 1, max: 4000, unit: ms } }
          - { name: F.B,   description: Adjusts the feedback amount., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: HiDMP, description: Adjusts the treble attenuation of the delay sound., raw: "0 – 10", typed: { kind: int, min: 0, max: 10 } }
          - { name: Tone,  description: Adjusts the tone., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Mix,   description: Adjusts the amount of effected sound that is mixed with the original sound., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: P-P,   description: Sets delay output to mono or Ping Pong., raw: "MONO, P-P", typed: { kind: enum, values: [MONO, P-P] } }
          - { name: Tail,  description: Tail on/off behaviour as Delay., raw: "OFF, ON", typed: { kind: enum, values: [OFF, ON] } }

      - name: P-P Delay
        page: 23
        description: This delay outputs the delay sound alternately left and right.
        params:
          - { name: Time, description: Sets the delay time., raw: "1 – 4000", typed: { kind: int, min: 1, max: 4000, unit: ms } }
          - { name: F.B,  description: Adjusts the feedback amount., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Mix,  description: Adjusts the amount of effected sound that is mixed with the original sound., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Tail, description: Tail on/off behaviour as Delay., raw: "OFF, ON", typed: { kind: enum, values: [OFF, ON] } }

      - name: FilterDly
        page: 23
        description: This effect filters a delayed sound.
        params:
          - { name: Time, description: Sets the delay time., raw: "1 – 2000", typed: { kind: int, min: 1, max: 2000, unit: ms } }
          - { name: F.B,  description: Adjusts the feedback amount., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Mix,  description: Adjusts the amount of effected sound that is mixed with the original sound., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Tail, description: Tail on/off behaviour as Delay., raw: "OFF, ON", typed: { kind: enum, values: [OFF, ON] } }

      - name: Dual DLY
        page: 23
        description: This effect combines 2 individual delays.
        params:
          - { name: TimeA, description: Adjusts the delay time of Delay A., raw: "0 – 1490", typed: { kind: int, min: 0, max: 1490, unit: ms } }
          - { name: F.B A, description: Adjusts the Delay A feedback amount., raw: "0 – 110", typed: { kind: int, min: 0, max: 110 } }
          - { name: TimeB, description: Adjusts the delay time of Delay B., raw: "0 – 1490", typed: { kind: int, min: 0, max: 1490, unit: ms } }
          - { name: F.B B, description: Adjusts the Delay B feedback amount., raw: "0 – 110", typed: { kind: int, min: 0, max: 110 } }
          - { name: DlyMx, description: Adjust the mix of the Delay A and B effect sounds., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: BAL,   description: Adjusts the balance between original and effect sounds., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - name: Depth
            description: Sets the depth of the modulation.
            raw: "MN-0 – ST-50"
            typed: { kind: special, note: "Bipolar range: MN-0 (mono, no modulation) through ST-50 (full stereo modulation). Treat as enum-of-strings or model as signed scale; confirm encoding against PDF." }
          - { name: Speed, description: Sets the speed of the modulation., raw: "0 – 50", typed: { kind: int, min: 0, max: 50 } }

      - name: Pitch DLY
        page: 23
        description: This effect applies pitch shift to a delayed sound.
        params:
          - { name: Pitch, description: Sets volume of pitch shift applied to delayed sound., raw: "-12 – 12", typed: { kind: int, min: -12, max: 12, unit: semitones } }
          - { name: Time,  description: Sets the delay time., raw: "1 – 2000", typed: { kind: int, min: 1, max: 2000, unit: ms } }
          - { name: F.B,   description: Adjusts the feedback amount., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Mix,   description: Adjusts the amount of effected sound that is mixed with the original sound., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

      - name: SlapBackD
        page: 23
        description: This delay features a short delay time that is good for muted rhythm playing and rockabilly.
        params:
          - { name: Time,  description: "Sets the delay time. When Sync is chosen, the delay time is synchronized to the tempo.", raw: "1 – 300", typed: { kind: int, min: 1, max: 300, unit: ms } }
          - { name: F.B,   description: Adjusts the feedback amount., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Mix,   description: Adjusts the amount of effected sound that is mixed with the original sound., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - name: SubDv
            description: "Set the note length of the delay sound. When P-P is chosen, L/R channels output delays in quarter/dotted eighth notes respectively."
            raw: "♩, ♪, P-P"
            typed: { kind: enum, values: ["♩", "♪", "P-P"] }
            note: "Source PDF shows musical-note glyphs that the OCR dropped; documented as quarter-note ♩ and eighth-note ♪ based on the description text."
        notes:
          - "SubDv glyph values reconstructed from prose; verify against PDF page 23."

      - name: A-Pan DLY
        page: 24
        description: This combines auto pan and delay to create the effect of the stereo image moving cyclically.
        params:
          - { name: Time,  description: Sets the delay time., raw: "1 – 1500", typed: { kind: int, min: 1, max: 1500, unit: ms } }
          - { name: F.B,   description: Adjusts the feedback amount., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Mix,   description: Adjusts the amount of effected sound that is mixed with the original sound., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Link,  description: Sets the order that the auto pan and delay are connected., raw: "PAN-DLY, DLY-PAN", typed: { kind: enum, values: [PAN-DLY, DLY-PAN] } }
          - name: Cycle
            description: Sets the speed of the sound movement.
            raw: "1/4 – 50"
            typed: { kind: special, note: "Range begins at the tempo-sync value 1/4 (quarter note) and extends through integer 50. Lower end of the numeric scale is replaced by a note-value glyph." }
          - { name: Width, description: Sets the width of the sound movement., raw: "0 – 50", typed: { kind: int, min: 0, max: 50 } }
          - { name: Clip,  description: Adjusts the amount of waveform clipping., raw: "0 – 10", typed: { kind: int, min: 0, max: 10 } }

      - name: PhaseDly
        page: 24
        description: This effect applies a phaser to a delayed sound.
        params:
          - { name: Time,  description: Sets the delay time., raw: "1 – 2000", typed: { kind: int, min: 1, max: 2000, unit: ms } }
          - { name: F.B,   description: Adjusts the feedback amount., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Mix,   description: Adjusts the amount of effected sound that is mixed with the original sound., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Tail,  description: Tail on/off behaviour as Delay., raw: "OFF, ON", typed: { kind: enum, values: [OFF, ON] } }
          - { name: Color, description: Sets the tone of the effect type., raw: "4 STG, 8 STG, INV 4, INV 8", typed: { kind: enum, values: ["4 STG", "8 STG", "INV 4", "INV 8"] } }
          - { name: Depth, description: Sets the depth of the modulation., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Rate,  description: Sets the speed of the modulation., raw: "1 – 50",  typed: { kind: int, min: 1, max: 50 } }
          - { name: Reso,  description: Sets effect resonance., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

      - name: TapeEcho3
        page: 24
        description: This tape echo effect models the MAESTRO ECHOPLEX EP-3.
        params:
          - { name: Gain,  description: Adjusts the gain., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Hi,    description: Adjusts volume of high frequencies., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Lo,    description: Adjusts volume of low frequencies., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: VOL,   description: Adjusts the volume., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Time,  description: Sets the delay time., raw: "10 – 1000", typed: { kind: int, min: 10, max: 1000, unit: ms } }
          - { name: F.B,   description: Adjusts the feedback amount., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Mix,   description: Adjusts the amount of effected sound that is mixed with the original sound., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: RecLv, description: Adjusts the volume recorded to the tape., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

      - name: ICE Delay
        page: 24
        description: This effect combines pitch shifting and delay.
        params:
          - name: INTVL
            description: Sets the pitch modulation amount for the audio slices.
            raw: "-OCT – 2 OCT"
            typed: { kind: special, note: "Pitch interval from -1 octave (-OCT) up to +2 octaves (2 OCT). Likely quantized in semitone or octave steps; confirm step granularity against PDF." }
          - { name: Time, description: Sets the delay time., raw: "60 – 1300", typed: { kind: int, min: 60, max: 1300, unit: ms } }
          - { name: F.B,  description: Adjusts the feedback amount., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Mix,  description: Adjusts the amount of effected sound that is mixed with the original sound., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

      - name: SlwAtkDly
        page: 24
        description: This effect combines slow attack and delay.
        params:
          - { name: Swell, description: Adjusts the attack time., raw: "1 – 50", typed: { kind: int, min: 1, max: 50 } }
          - { name: Time,  description: Sets the delay time., raw: "1 – 1900", typed: { kind: int, min: 1, max: 1900, unit: ms } }
          - { name: F.B,   description: Adjusts the feedback amount., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Mix,   description: Adjusts the amount of effected sound that is mixed with the original sound., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

      - name: SoftEcho
        page: 24
        description: This echo has a soft tone. This echo effect allows the use of modulation.
        params:
          - { name: MOD,  description: Turns modulation ON or OFF., raw: "OFF, ON", typed: { kind: enum, values: [OFF, ON] } }
          - { name: Time, description: Sets the delay time., raw: "19 – 581", typed: { kind: int, min: 19, max: 581, unit: ms } }
          - { name: F.B,  description: Adjusts the feedback amount., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Mix,  description: Adjusts the amount of effected sound that is mixed with the original sound., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

