          - { name: RESO,  description: Sets effect resonance., raw: "0 – 10",  typed: { kind: int, min: 0, max: 10 } }
          - { name: Wave,  description: Sets the modulation waveform., raw: "SINE, TRI, SAWUP, SAWDN", typed: { kind: enum, values: [SINE, TRI, SAWUP, SAWDN] } }

