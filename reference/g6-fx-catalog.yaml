# Zoom G6 FX Catalog — Structured
#
# Source: reference/E_G6_FX-list_2.txt (transcribed from E_G6_FX-list_2.pdf, © 2021 ZOOM CORPORATION).
# Status: Single source of truth for effect names, parameter names, and parameter ranges.
#
# Schema:
#   categories:
#     <CATEGORY_NAME>:
#       pages: [<int>, ...]              # source PDF pages where this category appears
#       effects:
#         - name: <string>               # exact display name from the catalog
#           page: <int>                  # primary page of this entry
#           description: <string>        # verbatim from catalog
#           params:
#             - name: <string>           # exact parameter name
#               description: <string>    # verbatim
#               raw: <string>            # range string verbatim from catalog (em-dashes preserved as " – ")
#               typed:                   # machine-usable range
#                 kind: int | float | enum | special
#                 # for kind: int / float
#                 min: <number>          # inclusive
#                 max: <number>          # inclusive
#                 unit: <string>         # optional, only when catalog implies it (ms, Hz, semitones, cents, dB)
#                 # for kind: enum
#                 values: [<string>, ...]
#                 # for kind: special
#                 note: <string>         # explanation of non-numeric / mixed range
#           notes: [<string>, ...]       # optional, OCR ambiguities or cross-refs
#
# Conventions:
#   - All ranges are inclusive on both ends unless `note` says otherwise.
#   - "OFF" inside a numeric range (e.g., "OFF – 100") is modelled as kind: special with the raw string preserved,
#     because OFF is a discrete state below the numeric floor.
#   - Tempo-synced delay/mod params occasionally accept a note-value glyph (♩ ♪) that OCR dropped — flagged in `notes`.
#   - Pedal-controllable parameters in the [ PEDAL ] category are marked by a trailing "P" in the source.
#     This catalog records the underlying numeric range; the "P" capability is implicit for that category.
#
# Hard rules for any tool reading this file:
#   1. Never propose an effect not present here.
#   2. Never propose a parameter value outside its typed range (or outside `raw` when kind is special).
#   3. Cite (category, effect name, page) when referencing an entry.

generated_from: reference/E_G6_FX-list_2.txt
