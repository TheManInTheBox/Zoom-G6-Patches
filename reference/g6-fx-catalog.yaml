          - { name: VOL,    description: Adjusts the volume., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

      - name: Gt GEQ7
        page: 5
        description: This mono graphic equalizer has 7 bands that suit guitar frequencies.
        params:
          - { name: "100",  description: "Boosts or cuts the low (100 Hz) frequency band.", raw: "-12 – 12", typed: { kind: int, min: -12, max: 12, unit: dB } }
          - { name: "200",  description: "Boosts or cuts the low (200 Hz) frequency band.", raw: "-12 – 12", typed: { kind: int, min: -12, max: 12, unit: dB } }
