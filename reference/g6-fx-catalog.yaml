          - { name: Speed, description: Sets the speed of the modulation., raw: "1 – 50", typed: { kind: int, min: 1, max: 50 } }
          - { name: RESO,  description: Sets effect resonance., raw: "0 – 10", typed: { kind: int, min: 0, max: 10 } }

