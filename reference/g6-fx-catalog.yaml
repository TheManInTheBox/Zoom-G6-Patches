          - { name: PTTRN, description: Sets effect pattern., raw: "A – C", typed: { kind: enum, values: [A, B, C] } }
          - { name: Voice, description: Adjusts the vowel sounds., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: Mode,  description: Sets the sound style., raw: "STEP, SOFT", typed: { kind: enum, values: [STEP, SOFT] } }

      - name: PDL Roto
        page: 29
        description: Simulates a rotary speaker.
        params:
          - { name: Mode,  description: "Sets the rotary mode. (Pedal-controllable.)", raw: "SLOW, FAST", typed: { kind: enum, values: [SLOW, FAST] } }
          - { name: Drive, description: Adjusts the amount of amplification from the preamp., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: BAL,   description: Adjusts the balance between the horn (high frequencies) and the drum (low frequencies)., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }
          - { name: VOL,   description: Adjusts the volume., raw: "0 – 100", typed: { kind: int, min: 0, max: 100 } }

      - name: P-BitCRSH
        page: 29
