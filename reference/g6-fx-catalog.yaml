          - { name: RESO,  description: Sets effect resonance., raw: "0 – 10",  typed: { kind: int, min: 0, max: 10 } }
          - { name: Shape, description: Adjusts the effect envelope., raw: "0 – 10",  typed: { kind: int, min: 0, max: 10 } }

